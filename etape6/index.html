<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>TP4 JS – Étape 6 : Suppression des lignes sélectionnées</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="table_container">

    
    <div id="form_container">
      <label for="nom">Nom :</label>
      <input type="text" id="nom" placeholder="Entrer le nom" />

      <label for="prenom">Prénom :</label>
      <input type="text" id="prenom" placeholder="Entrer le prénom" />

      <label for="points">Points :</label>
      <input type="number" id="points" placeholder="Entrer les points" />

      <button id="btn_add" class="btn-add">Ajouter</button>
    </div>


    <table border="1">
      <thead>
        <tr>
          <th class="col_number">N°</th>
          <th class="col_text">Nom</th>
          <th class="col_text">Prénom</th>
          <th class="col_text">Points</th>
          <th class="col_chkbox">Sélection</th>
        </tr>
      </thead>
      <tbody id="table_body"></tbody>
    </table>

    <div id="resume_container">
      <p id="nb_lignes">0 ligne(s)</p>
      <p id="total_points">Total point(s) = 0</p>
    </div>

    <div id="container_btn">
      <button id="btn_console" class="btn-consol">Console Tableau</button>
      <button id="btn_delete" class="btn-del">Supprimer</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
